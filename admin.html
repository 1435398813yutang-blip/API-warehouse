<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>管理后台 - API小仓库</title>
  <style>
    :root{
      --bg:#f5f3ef; --card-rgb:255,255,255; --card-opacity:.95;
      --text:#2d2b28; --text-2:#6b6862; --border:#b8c0c6; 
      --accent:#8a9ba8; --accent-soft:#c7d0d4; --danger:#b57b7b;
      --radius:6px; --shadow:0 2px 8px rgba(0,0,0,.05);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{margin:0;padding:0;background:var(--bg);color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;font-size:15px}
    button{font-family:inherit}
    
    .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;
      padding:14px 16px;background:rgba(255,255,255,0.9);backdrop-filter:blur(10px);
      border-bottom:1.5px solid var(--border)}
    .topbar h1{margin:0;font-size:19px;font-family:Georgia,serif;font-weight:600}

    main{padding:16px 16px 90px}
    
    .menu-panel {
      background: #fff;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
    }
    .menu-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-2);
      margin-bottom: 12px;
      padding-left: 4px;
    }
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .menu-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 40px;
      padding: 0 4px;
      border-radius: var(--radius);
      border: 1.5px solid var(--border);
      background: transparent;
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background-color 0.2s;
    }
    .menu-btn:active {
      background: rgba(0,0,0,0.05);
    }
    .menu-btn.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .menu-btn.danger {
      color: var(--danger);
      border-color: var(--danger);
    }

    .section-title{font-size:14px;font-weight:600;color:var(--text-2);margin:20px 0 10px 4px;display:flex;justify-content:space-between;align-items:center;}
    
    .notice-scroll-box {
      max-height: 40vh;
      overflow-y: auto;
      padding-right: 4px;
    }

    .admin-notice-card { background: #fff; border: 1.5px solid var(--border); border-radius: var(--radius); margin-bottom: 8px; box-shadow: var(--shadow); overflow: hidden; }
    .admin-notice-header { display: flex; justify-content: space-between; align-items: center; padding: 12px; cursor: pointer; user-select: none; }
    .admin-notice-header .left-part { display: flex; align-items: center; gap: 6px; flex: 1; }
    .admin-notice-title { font-weight: 600; font-size: 14px; color: var(--text); }
    .admin-notice-date { font-size: 12px; color: var(--text-2); }
    .admin-notice-arrow { font-size: 10px; color: var(--text-2); transition: transform 0.2s; }
    .admin-notice-card.expanded .admin-notice-arrow { transform: rotate(180deg); }
    .admin-notice-body { display: none; padding: 0 12px 12px; border-top: 1px dashed #eee; margin-top: 4px; padding-top: 12px; }
    .admin-notice-card.expanded .admin-notice-body { display: block; }
    .admin-notice-content { font-size: 13px; color: var(--text-2); white-space: pre-wrap; word-break: break-word; margin-bottom: 12px; }
    
    .pin-badge{background:var(--danger); color:#fff; font-size:10px; padding:2px 5px; border-radius:4px;}

    .group{margin-bottom:16px}
    .group-head{display:flex;align-items:center;gap:8px;padding:8px 4px;cursor:pointer;user-select:none}
    .group-head .arrow{font-size:12px;color:var(--text-2);transition:.2s}
    .group.collapsed .arrow{transform:rotate(-90deg)}
    .group-head .gname{font-weight:600;font-size:14px;flex:1}
    .group-head .gcount{font-size:12px;color:var(--text-2)}
    .group.collapsed .group-body{display:none}

    .site-card{background:#fff;border:1.5px solid var(--border);border-radius:var(--radius);
      padding:12px;margin-bottom:8px;box-shadow:var(--shadow)}
    .site-top{display:flex;align-items:flex-start;gap:8px}
    .site-name{flex:1;font-weight:600;font-size:15px;word-break:break-all}
    .site-meta{margin-top:6px;font-size:12px;color:var(--text-2);word-break:break-all}
    .tag-list{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
    .tag{font-size:11px;padding:2px 7px;border-radius:var(--radius);background:var(--accent-soft);color:#fff}
    .site-note{margin-top:6px;font-size:12px;color:var(--text-2);white-space:pre-wrap;word-break:break-word}
    .btn-row{display:flex;gap:8px;margin-top:12px;padding-top:10px;border-top:1px dashed #eee}
    .btn{flex:1;padding:8px;border-radius:var(--radius);border:1.5px solid var(--border);
      background:transparent;color:var(--text);font-size:13px;cursor:pointer;text-align:center}
    .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
    .btn.danger{color:var(--danger);border-color:var(--danger)}
    .btn:disabled{background:#ccc;color:#888;border-color:#ccc;cursor:not-allowed}

    .fab-wrap{position:fixed;right:16px;bottom:20px;display:flex;gap:10px;z-index:30}
    .fab{padding:0 20px;height:48px;border-radius:24px;
      background:var(--accent);color:#fff;border:none;font-size:15px;font-weight:600;
      box-shadow:0 4px 12px rgba(0,0,0,.2);cursor:pointer;display:flex;align-items:center;justify-content:center}
    .fab:disabled{background:#ccc;color:#888;cursor:not-allowed;box-shadow:none}
    .fab.publish{background:#5f7d8c}

    .modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:none;align-items:flex-end;justify-content:center}
    .modal-mask.show{display:flex}
    .modal{background:#fff;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;
      border-radius:16px 16px 0 0;padding:20px 16px;animation:slideUp .2s ease-out}
    @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
    .modal h3{margin:0 0 16px;font-size:16px;font-family:Georgia,serif}
    
    .field{margin-bottom:12px}
    .field label{display:block;font-size:12px;color:var(--text-2);margin-bottom:6px;font-weight:600}
    .field input,.field textarea{width:100%;padding:10px;border:1.5px solid var(--border);
      border-radius:var(--radius);background:#fff;font-size:14px;outline:none;font-family:inherit}
    .field textarea{min-height:80px;resize:vertical}
    
    .chip-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
    .chip{padding:6px 12px;border-radius:var(--radius);border:1.5px solid var(--border);
      background:#fff;font-size:13px;cursor:pointer;color:var(--text-2);user-select:none;transition:.1s}
    .chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}

    .contact-row { display: flex; gap: 8px; margin-bottom: 8px; }
    .contact-row input { flex: 1; margin: 0; }
    .contact-row button { padding: 0 12px; border: 1.5px solid var(--danger); color: var(--danger); background: transparent; border-radius: var(--radius); cursor: pointer; }
    
    .manage-list { max-height: 40vh; overflow-y: auto; border: 1.5px solid var(--border); border-radius: var(--radius); padding: 8px; background: #faf9f7; }
    .manage-item { display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px dashed #ddd; font-size: 14px; }
    .manage-item:last-child { border-bottom: none; }
    .manage-item button { padding: 2px 8px; font-size: 12px; border: 1px solid var(--danger); color: var(--danger); background: transparent; border-radius: 4px; cursor: pointer; }

    .publish-status{font-size:13px;margin-left:8px}
    .publish-status.ok{color:#2e7d32}
    .publish-status.no{color:#999}

    /* 发布预览对比 */
    .preview-box{max-height:40vh;overflow-y:auto;border:1.5px solid var(--border);border-radius:var(--radius);padding:8px;background:#faf9f7;margin-bottom:12px}
    .pv-card{background:#fff;border:1.5px solid var(--border);border-radius:var(--radius);padding:10px;margin-bottom:8px}
    .pv-card.add{border-color:#7aa87a}
    .pv-card.edit{border-color:#d2a35f}
    .pv-card.del{border-color:var(--danger);opacity:.55;background:#f3eeee}
    .pv-badge{font-size:10px;color:#fff;padding:2px 6px;border-radius:4px;margin-right:6px}
    .pv-badge.add{background:#7aa87a}
    .pv-badge.edit{background:#d2a35f}
    .pv-badge.del{background:var(--danger)}
    .pv-title{font-weight:600;font-size:13px;display:inline}
    .pv-sub{font-size:11px;color:var(--text-2);margin-top:4px;word-break:break-all}
    .pv-body{font-size:12px;color:var(--text-2);white-space:pre-wrap;word-break:break-word;margin-top:8px;padding-top:8px;border-top:1px dashed #eee}
    .pv-count{font-size:13px;font-weight:600;margin-bottom:8px}
    .pv-warn{font-size:12px;color:#b57b7b;margin-bottom:8px}
  </style>
</head>
<body>

<header class="topbar">
  <h1>管理后台</h1>
</header>

<main>
  <div class="menu-panel">
    <div class="menu-title">管理菜单</div>
    <div class="menu-grid">
      <!-- 第一行 -->
      <button class="menu-btn" id="btnManageGroups">分组管理</button>
      <button class="menu-btn" id="btnManageTags">标签管理</button>
      <button class="menu-btn" id="btnSettings">联系方式</button>
      
      <!-- 第二行 -->
      <button class="menu-btn primary" id="btnAddSite">+ 新增站点</button>
      <button class="menu-btn primary" id="btnAddNotice">+ 新增公告</button>
      <div></div> <!-- 占位空位 -->
      
      <!-- 第三行 -->
      <button class="menu-btn" id="btnImport">导入</button>
      <button class="menu-btn" id="btnReset">恢复线上</button>
      <button class="menu-btn" id="btnPublishConfig">发布配置</button>
    </div>
  </div>

  <div class="section-title">
    <span>公告列表</span>
  </div>
  <div class="notice-scroll-box" id="noticeList"></div>

  <div class="section-title">收录站点列表</div>
  <div id="siteList"></div>
</main>

<input type="file" id="fileImport" accept=".json" style="display:none">

<div class="fab-wrap">
  <button class="fab" id="btnExport">导出 JSON</button>
  <button class="fab publish" id="btnPublish">一键发布</button>
</div>

<div class="modal-mask" id="modalMask">
  <div class="modal" id="modalBox"></div>
</div>

<script>
let registry = { 
  version: 1, updatedAt: "", notice: [], contact: [], 
  presetGroups: [], presetTags: [], sites: [] 
};
let currentGroups = [];
let currentTags = [];
let collapsedGroups = [];

const STORAGE_KEY = 'api_tool_registry_draft';
const PUBLISH_CONFIG_KEY = 'admin_publish_config';
let sessionPublishPassword = '';
let publishPasswordTemp = ''; // 本次发布流程中的临时密码（未勾记住时用）

function saveToLocal() { localStorage.setItem(STORAGE_KEY, JSON.stringify(registry)); }

async function loadData() {
  const draft = localStorage.getItem(STORAGE_KEY);
  if (draft) {
    try { registry = JSON.parse(draft); } catch(e) {}
  } else {
    try {
      const res = await fetch('./registry.json');
      if (res.ok) { registry = await res.json(); saveToLocal(); }
    } catch (e) {}
  }

  if (registry.contact && !Array.isArray(registry.contact)) {
    const newContact = [];
    if (registry.contact.email) newContact.push({ label: '邮箱', value: registry.contact.email });
    if (registry.contact.qq) newContact.push({ label: 'QQ', value: registry.contact.qq });
    registry.contact = newContact;
  }
  if (!Array.isArray(registry.contact)) registry.contact = [];

  currentGroups = registry.presetGroups || ["付费站","公益站","有签到","限制签到","生图站"];
  currentTags = registry.presetTags || ["试吃","无试吃","试吃不确定","需邀请码","关闭注册","生图","视频","音频","抗截断","常用"];
  render();
}

function render() {
  renderNotices();
  renderSites();
}

function renderNotices() {
  const wrap = document.getElementById("noticeList");
  const notices = registry.notice || [];
  if(notices.length === 0) {
    wrap.innerHTML = `<div style="font-size:12px;color:#999;padding:10px 4px;">暂无公告</div>`;
    return;
  }

  let sortedNotices = notices.map((n, i) => ({ ...n, originalIndex: i }));

  sortedNotices.sort((a, b) => {
    const pinA = a.isPinned ? 1 : 0;
    const pinB = b.isPinned ? 1 : 0;
    if (pinA !== pinB) return pinB - pinA;
    const dateComp = (b.date || "").localeCompare(a.date || "");
    if (dateComp !== 0) return dateComp;
    return b.originalIndex - a.originalIndex;
  });

  wrap.innerHTML = sortedNotices.map((n) => {
    const pinHtml = n.isPinned ? '<span class="pin-badge">置顶</span>' : '';
    return `<div class="admin-notice-card" data-idx="${n.originalIndex}">
      <div class="admin-notice-header">
        <div class="left-part">${pinHtml}<span class="admin-notice-title">${n.title}</span></div>
        <div style="display:flex; align-items:center; gap:8px;">
          <span class="admin-notice-date">${n.date}</span>
          <span class="admin-notice-arrow">▼</span>
        </div>
      </div>
      <div class="admin-notice-body">
        <div class="admin-notice-content">${n.content}</div>
        <div class="btn-row" style="border:none; margin-top:0; padding-top:0;">
          <button class="btn" onclick="editNotice(${n.originalIndex})">编辑</button>
          <button class="btn danger" onclick="deleteNotice(${n.originalIndex})">删除</button>
        </div>
      </div>
    </div>`;
  }).join("");

  wrap.querySelectorAll(".admin-notice-header").forEach(header => {
    header.onclick = () => { header.parentElement.classList.toggle("expanded"); };
  });
}

function renderSites() {
  const wrap = document.getElementById("siteList");
  const allGroups = [...currentGroups];
  registry.sites.forEach(s => { if(s.group && !allGroups.includes(s.group)) allGroups.push(s.group); });

  const html = [];
  allGroups.forEach(g => {
    const items = registry.sites.filter(s => s.group === g);
    if(!items.length && !currentGroups.includes(g)) return;
    
    const isCollapsed = collapsedGroups.includes(g);
    html.push(`<section class="group ${isCollapsed ? 'collapsed' : ''}" data-group="${g}">
      <div class="group-head" onclick="toggleGroup('${g}')">
        <span class="arrow">▼</span>
        <span class="gname">${g}</span>
        <span class="gcount">${items.length}</span>
      </div>
      <div class="group-body">
        ${items.map(s => cardHTML(s)).join("")}
      </div>
    </section>`);
  });

  if(registry.sites.length === 0) {
    wrap.innerHTML = `<div style="text-align:center;color:#999;padding:20px">暂无收录站点</div>`;
  } else {
    wrap.innerHTML = html.join("");
  }
}

function cardHTML(s) {
  const tags = (s.tags || []).map(t => `<span class="tag">${t}</span>`).join("");
  return `<div class="site-card">
    <div class="site-top">
      <div class="site-name">${(s.tags||[]).includes("常用") ? '<span style="color:var(--accent)">☆</span> ' : ''}${s.name}</div>
    </div>
    <div class="site-meta">${s.invite}</div>
    <div class="tag-list">${tags}</div>
    ${s.note ? `<div class="site-note">${s.note}</div>` : ""}
    <div class="btn-row">
      <button class="btn" onclick="editSite('${s.id}')">编辑</button>
      <button class="btn danger" onclick="deleteSite('${s.id}')">删除</button>
    </div>
  </div>`;
}

window.toggleGroup = (g) => {
  const idx = collapsedGroups.indexOf(g);
  if (idx >= 0) collapsedGroups.splice(idx, 1);
  else collapsedGroups.push(g);
  renderSites();
};

window.deleteSite = (id) => {
  if (!confirm('确定删除该站点？')) return;
  registry.sites = registry.sites.filter(s => s.id !== id);
  saveToLocal();
  renderSites();
};

window.editSite = (id) => {
  const s = registry.sites.find(x => x.id === id);
  if(!s) return;
  openSiteForm(s);
};

window.deleteNotice = (idx) => {
  if(!confirm('确定删除这条公告？')) return;
  registry.notice.splice(idx, 1);
  saveToLocal();
  renderNotices();
};

window.editNotice = (idx) => {
  openNoticeForm(registry.notice[idx], idx);
};

function openSiteForm(site) {
  const isEdit = !!site;
  const s = site || { id: "r_" + Date.now(), name: "", invite: "", group: currentGroups[0], tags: [], note: "" };
  
  const groupChips = currentGroups.map(g => `<div class="chip ${s.group === g ? 'active' : ''}" data-group="${g}">${g}</div>`).join("");
  const tagChips = currentTags.map(t => `<div class="chip ${(s.tags||[]).includes(t) ? 'active' : ''}" data-tag="${t}">${t}</div>`).join("");

  document.getElementById("modalBox").innerHTML = `
    <h3>${isEdit ? '编辑站点' : '新增站点'}</h3>
    <input type="hidden" id="f-id" value="${s.id}">
    <div class="field"><label>站名 *</label><input id="f-name" value="${s.name}"></div>
    <div class="field"><label>链接 *</label><input id="f-invite" value="${s.invite}"></div>
    <div class="field"><label>分组（点击选择）</label><div class="chip-row" id="groupPicker">${groupChips}</div></div>
    <div class="field"><label>标签（点击多选）</label><div class="chip-row" id="tagPicker">${tagChips}</div></div>
    <div class="field"><label>备注</label><textarea id="f-note">${s.note||''}</textarea></div>
    <div class="btn-row" style="border:none;margin-top:20px;">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn primary" onclick="saveSiteForm()">保存</button>
    </div>
  `;

  document.querySelectorAll("#groupPicker .chip").forEach(c => {
    c.onclick = () => {
      document.querySelectorAll("#groupPicker .chip").forEach(el => el.classList.remove("active"));
      c.classList.add("active");
    };
  });
  document.querySelectorAll("#tagPicker .chip").forEach(c => {
    c.onclick = () => c.classList.toggle("active");
  });

  document.getElementById("modalMask").classList.add("show");
}

window.saveSiteForm = () => {
  try {
    const id = document.getElementById("f-id").value;
    const name = document.getElementById("f-name").value.trim();
    const invite = document.getElementById("f-invite").value.trim();
    
    if(!name || !invite) { alert("站名和链接必填"); return; }

    const activeGroup = document.querySelector("#groupPicker .chip.active");
    const group = activeGroup ? activeGroup.dataset.group : "其他";
    const tags = [...document.querySelectorAll("#tagPicker .chip.active")].map(c => c.dataset.tag);
    const obj = { id, name, invite, group, tags, note: document.getElementById("f-note").value.trim() };
    
    const idx = registry.sites.findIndex(x => x.id === id);
    if(idx >= 0) { registry.sites[idx] = obj; } else { registry.sites.push(obj); }

    saveToLocal();
    closeModal();
    renderSites();
  } catch (err) {
    alert("保存失败，可能存在非法数据：" + err.message);
    console.error(err);
  }
};

function openNoticeForm(notice, idx) {
  const isEdit = idx !== undefined;
  const n = notice || { date: new Date().toISOString().split('T')[0], title: "", content: "", isPinned: false };

  document.getElementById("modalBox").innerHTML = `
    <h3>${isEdit ? '编辑公告' : '发布新公告'}</h3>
    <input type="hidden" id="n-idx" value="${isEdit ? idx : ''}">
    <div class="field"><label>日期</label><input id="n-date" value="${n.date}"></div>
    <div class="field"><label>标题</label><input id="n-title" value="${n.title}"></div>
    <div class="field"><label>内容（支持换行）</label><textarea id="n-content" style="min-height:120px">${n.content}</textarea></div>
    <div class="field" style="display:flex; align-items:center; gap:8px;">
      <input type="checkbox" id="n-pinned" ${n.isPinned ? 'checked' : ''} style="width:16px; height:16px; margin:0;">
      <label for="n-pinned" style="margin:0; cursor:pointer;">是否置顶此公告</label>
    </div>
    <div class="btn-row" style="border:none;margin-top:20px;">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn primary" onclick="saveNoticeForm()">保存</button>
    </div>
  `;
  document.getElementById("modalMask").classList.add("show");
}

window.saveNoticeForm = () => {
  try {
    const idxStr = document.getElementById("n-idx").value;
    const date = document.getElementById("n-date").value.trim();
    const title = document.getElementById("n-title").value.trim();
    const content = document.getElementById("n-content").value.trim();
    const isPinned = document.getElementById("n-pinned").checked;
    if(!title || !content) return alert("标题和内容必填");

    const obj = { date, title, content, isPinned };
    if(idxStr !== '') { registry.notice[Number(idxStr)] = obj; } else { registry.notice.push(obj); }
    saveToLocal();
    closeModal();
    renderNotices();
  } catch (err) {
    alert("保存公告失败: " + err.message);
  }
};

function openManage(type) {
  const isGroup = type === 'group';
  const list = isGroup ? currentGroups : currentTags;
  const title = isGroup ? '管理分组' : '管理标签';
  
  const listHtml = list.map((item, i) => `
    <div class="manage-item">
      <span>${item}</span>
      <button onclick="deleteManageItem('${type}', ${i})">删除</button>
    </div>
  `).join("");

  document.getElementById("modalBox").innerHTML = `
    <h3>${title}</h3>
    <div class="field">
      <div style="display:flex; gap:8px;">
        <input type="text" id="m-new-name" placeholder="输入新名称..." style="flex:1;">
        <button class="btn primary" style="width:80px;" onclick="addManageItem('${type}')">+ 添加</button>
      </div>
    </div>
    <div class="manage-list">${listHtml || '<div style="text-align:center;color:#999;padding:10px;">暂无数据</div>'}</div>
    <div class="btn-row" style="border:none;margin-top:20px;">
      <button class="btn" onclick="closeModal()">关闭</button>
    </div>
  `;
  document.getElementById("modalMask").classList.add("show");
}

window.addManageItem = (type) => {
  const val = document.getElementById("m-new-name").value.trim();
  if (!val) return;
  const list = type === 'group' ? currentGroups : currentTags;
  if (list.includes(val)) return alert("该项已存在！");
  
  list.push(val);
  if (type === 'group') registry.presetGroups = currentGroups;
  else registry.presetTags = currentTags;
  
  saveToLocal();
  openManage(type);
};

window.deleteManageItem = (type, index) => {
  const isGroup = type === 'group';
  const list = isGroup ? currentGroups : currentTags;
  const itemName = list[index];
  
  if (isGroup) {
    const usedCount = registry.sites.filter(s => s.group === itemName).length;
    if (usedCount > 0) {
      return alert(`无法删除：当前有 ${usedCount} 个站点正在使用该分组，请先转移这些站点的分组。`);
    }
  }
  
  if (!confirm(`确定删除 ${isGroup ? '分组' : '标签'}「${itemName}」？`)) return;
  
  list.splice(index, 1);
  if (isGroup) registry.presetGroups = currentGroups;
  else registry.presetTags = currentTags;
  
  if (!isGroup) {
    registry.sites.forEach(s => {
      if (s.tags) s.tags = s.tags.filter(t => t !== itemName);
    });
  }
  
  saveToLocal();
  openManage(type);
};

function openSettings() {
  const contactList = registry.contact || [];
  
  const rowsHtml = contactList.map((c, i) => `
    <div class="contact-row" id="contact-row-${i}">
      <input type="text" class="c-label" value="${c.label || ''}" placeholder="名称(如微信)">
      <input type="text" class="c-value" value="${c.value || ''}" placeholder="内容">
      <button type="button" onclick="document.getElementById('contact-row-${i}').remove()">删除</button>
    </div>
  `).join("");

  document.getElementById("modalBox").innerHTML = `
    <h3>联系方式设置</h3>
    <div class="field">
      <label>动态字段列表（可以自定义添加，如微信、TG等）</label>
      <div id="contactListWrap">${rowsHtml}</div>
      <button class="btn" style="width:100%;margin-top:8px; border-style:dashed;" onclick="addContactRow()">+ 新增一行</button>
    </div>
    <div class="btn-row" style="border:none;margin-top:20px;">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn primary" onclick="saveSettings()">保存</button>
    </div>
  `;
  document.getElementById("modalMask").classList.add("show");
}

window.addContactRow = () => {
  const wrap = document.getElementById("contactListWrap");
  const div = document.createElement("div");
  div.className = "contact-row";
  const tempId = 'new_' + Date.now();
  div.id = tempId;
  div.innerHTML = `
    <input type="text" class="c-label" placeholder="名称(如微信)">
    <input type="text" class="c-value" placeholder="内容">
    <button type="button" onclick="document.getElementById('${tempId}').remove()">删除</button>
  `;
  wrap.appendChild(div);
};

window.saveSettings = () => {
  const rows = document.querySelectorAll("#contactListWrap .contact-row");
  const newContact = [];
  rows.forEach(row => {
    const label = row.querySelector(".c-label").value.trim();
    const value = row.querySelector(".c-value").value.trim();
    if (label && value) newContact.push({ label, value });
  });
  registry.contact = newContact;
  saveToLocal();
  closeModal();
  alert("联系方式已更新并自动保存至草稿，请记得导出并替换文件");
};

// ===== 一键发布模块 =====
function openPublishConfig() {
  const saved = localStorage.getItem(PUBLISH_CONFIG_KEY) || '';
  document.getElementById("modalBox").innerHTML = `
    <h3>发布配置（一键发布到线上）</h3>
    <div class="field">
      <label>Worker 地址</label>
      <input id="p-worker-url" placeholder="https://xxx.workers.dev" value="${saved}">
    </div>
    <div class="btn-row" style="border:none;">
      <button class="btn primary" onclick="savePublishConfig()">保存配置</button>
    </div>
    <div id="p-config-status" class="publish-status ${saved ? 'ok' : 'no'}" style="margin-top:8px;">${saved ? '●已配置' : '●未配置'}</div>
    <p style="font-size:12px;color:#999;margin-top:12px;">发布密码不保存，每次打开页面后首次发布时输入。发布前会展示变更预览。</p>
    <div class="btn-row" style="border:none;margin-top:20px;">
      <button class="btn" onclick="closeModal()">关闭</button>
    </div>
  `;
  document.getElementById("modalMask").classList.add("show");
}

window.savePublishConfig = () => {
  const url = document.getElementById("p-worker-url").value.trim().replace(/\/+$/, '');
  if (!url || !url.startsWith('https://')) { alert('请填写正确的 Worker 地址（https:// 开头）'); return; }
  localStorage.setItem(PUBLISH_CONFIG_KEY, url);
  const el = document.getElementById("p-config-status");
  el.textContent = '●已配置';
  el.className = 'publish-status ok';
  alert('已保存');
};

window.startPublish = async () => {
  const workerUrl = localStorage.getItem(PUBLISH_CONFIG_KEY);
  if (!workerUrl) { alert('请先在菜单"发布配置"中填写 Worker 地址'); openPublishConfig(); return; }

  // 密码：会话内已有则直接用，否则先记在临时变量，勾了记住才升级为会话密码
  if (!sessionPublishPassword) {
    publishPasswordTemp = '';
    document.getElementById("modalBox").innerHTML = `
      <h3>输入发布密码</h3>
      <div class="field"><input type="password" id="p-password" placeholder="发布密码"></div>
      <div class="field" style="display:flex; align-items:center; gap:8px;">
        <input type="checkbox" id="p-remember" checked style="width:16px; height:16px; margin:0;">
        <label for="p-remember" style="margin:0; cursor:pointer;">本次会话记住（关闭页面后失效）</label>
      </div>
      <div class="btn-row" style="border:none;margin-top:20px;">
        <button class="btn" onclick="closeModal()">取消</button>
        <button class="btn primary" onclick="submitPublishPassword()">确定</button>
      </div>
    `;
    document.getElementById("modalMask").classList.add("show");
    return;
  }
  await showPublishPreview();
};

window.submitPublishPassword = async () => {
  const pwd = document.getElementById("p-password").value;
  if (!pwd) { alert('密码不能为空'); return; }
  publishPasswordTemp = pwd;
  if (document.getElementById("p-remember").checked) sessionPublishPassword = pwd;
  await showPublishPreview();
};

// 拉取线上 registry.json 用于对比
async function fetchOnlineRegistry() {
  try {
    const res = await fetch('./registry.json?_=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) return null;
    return await res.json();
  } catch (e) { return null; }
}

// 对比逻辑：站点按 id，公告按 date+title
function diffRegistry(local, online) {
  const changes = [];
  const localSites = local.sites || [];
  const onlineSites = (online && online.sites) || [];
  const onlineSiteMap = {};
  onlineSites.forEach(s => { onlineSiteMap[s.id] = s; });
  const localSiteIds = {};

  localSites.forEach(s => {
    localSiteIds[s.id] = true;
    if (!onlineSiteMap[s.id]) {
      changes.push({ type: 'site', status: 'add', item: s });
    } else if (JSON.stringify(onlineSiteMap[s.id]) !== JSON.stringify(s)) {
      changes.push({ type: 'site', status: 'edit', item: s, old: onlineSiteMap[s.id] });
    }
  });
  onlineSites.forEach(s => {
    if (!localSiteIds[s.id]) {
      changes.push({ type: 'site', status: 'del', item: s });
    }
  });

  const localNotices = local.notice || [];
  const onlineNotices = (online && online.notice) || [];
  const keyOf = n => (n.date || '') + '|' + (n.title || '');
  const onlineNoticeMap = {};
  onlineNotices.forEach(n => { onlineNoticeMap[keyOf(n)] = n; });
  const localNoticeKeys = {};

  localNotices.forEach(n => {
    const k = keyOf(n);
    localNoticeKeys[k] = true;
    if (!onlineNoticeMap[k]) {
      changes.push({ type: 'notice', status: 'add', item: n });
    } else if (JSON.stringify(onlineNoticeMap[k]) !== JSON.stringify(n)) {
      changes.push({ type: 'notice', status: 'edit', item: n });
    }
  });
  onlineNotices.forEach(n => {
    if (!localNoticeKeys[keyOf(n)]) {
      changes.push({ type: 'notice', status: 'del', item: n });
    }
  });

  return changes;
}

function pvCardHTML(c) {
  const st = c.status;
  const badge = st === 'add' ? '<span class="pv-badge add">新增</span>'
              : st === 'edit' ? '<span class="pv-badge edit">修改</span>'
              : '<span class="pv-badge del">删除</span>';
  if (c.type === 'site') {
    return `<div class="pv-card ${st}">
      <div><span class="pv-badge ${st}">${st === 'add' ? '新增' : st === 'edit' ? '修改' : '删除'}</span><span class="pv-title">${c.item.name}</span></div>
      <div class="pv-sub">${c.item.invite || ''}</div>
    </div>`;
  }
  // 公告：可展开看内容
  return `<div class="pv-card ${st}" onclick="this.querySelector('.pv-body').style.display = this.querySelector('.pv-body').style.display === 'block' ? 'none' : 'block'">
    <div>${badge}<span class="pv-title">${c.item.title}</span></div>
    <div class="pv-sub">${c.item.date || ''}${c.item.isPinned ? ' · 置顶' : ''}</div>
    <div class="pv-body" style="display:none">${c.item.content}</div>
  </div>`;
}

async function showPublishPreview() {
  const pwdInUse = sessionPublishPassword || publishPasswordTemp;
  const online = await fetchOnlineRegistry();

  if (!online) {
    // 降级：无法对比，全量提示
    document.getElementById("modalBox").innerHTML = `
      <h3>确认发布？</h3>
      <div class="pv-warn">⚠ 无法获取线上数据进行对比，将全量发布。</div>
      <div class="pv-count">站点 ${(registry.sites||[]).length} 个 · 公告 ${(registry.notice||[]).length} 条</div>
      <p style="font-size:12px;color:#999;">发布后将自动提交到 GitHub 仓库，Pages 自动重新部署，约 1-2 分钟生效。</p>
      <div class="btn-row" style="border:none;margin-top:20px;">
        <button class="btn" onclick="closeModal()">取消</button>
        <button class="btn primary" id="p-confirm-btn" onclick="doPublish()">确认发布</button>
      </div>
    `;
    document.getElementById("modalMask").classList.add("show");
    return;
  }

  const changes = diffRegistry(registry, online);

  if (changes.length === 0) {
    document.getElementById("modalBox").innerHTML = `
      <h3>无需发布</h3>
      <p style="font-size:14px;">本地草稿与线上数据一致，没有需要发布的变更。</p>
      <div class="btn-row" style="border:none;margin-top:20px;">
        <button class="btn primary" onclick="closeModal()">好</button>
      </div>
    `;
    document.getElementById("modalMask").classList.add("show");
    return;
  }

  const addN = changes.filter(c => c.status === 'add').length;
  const editN = changes.filter(c => c.status === 'edit').length;
  const delN = changes.filter(c => c.status === 'del').length;

  document.getElementById("modalBox").innerHTML = `
    <h3>确认发布？</h3>
    <div class="pv-count">共 ${changes.length} 处变更：新增 ${addN} · 修改 ${editN} · 删除 ${delN}</div>
    <div class="preview-box">${changes.map(pvCardHTML).join('')}</div>
    <p style="font-size:12px;color:#999;">公告卡片可点击展开查看内容。发布后将自动提交到 GitHub，约 1-2 分钟生效。</p>
    <div class="btn-row" style="border:none;margin-top:16px;">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn primary" id="p-confirm-btn" onclick="doPublish()">确认发布</button>
    </div>
  `;
  document.getElementById("modalMask").classList.add("show");
}

window.doPublish = async () => {
  const btn = document.getElementById("p-confirm-btn");
  btn.disabled = true; btn.textContent = '发布中…';
  try {
    const workerUrl = localStorage.getItem(PUBLISH_CONFIG_KEY);
    registry.updatedAt = new Date().toISOString().split('T')[0];
    const res = await fetch(workerUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: sessionPublishPassword || publishPasswordTemp, content: JSON.stringify(registry, null, 2) })
    });
    const data = await res.json();
    closeModal();
    saveToLocal();
    if (data.ok) {
      alert('发布成功！GitHub 正在自动部署，约 1-2 分钟后前台生效。');
    } else {
      if ((data.error || '').indexOf('密码') > -1) { sessionPublishPassword = ''; publishPasswordTemp = ''; }
      alert('发布失败：' + (data.error || '未知错误') + '\n\n可使用右下角"导出 JSON"手动上传到 GitHub 兜底。');
    }
  } catch (e) {
    closeModal();
    alert('发布失败：网络错误 ' + e.message + '\n\n可使用"导出 JSON"手动上传兜底。');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '确认发布'; }
  }
};

// 事件绑定
document.getElementById("btnAddSite").onclick = () => openSiteForm(null);
document.getElementById("btnAddNotice").onclick = () => openNoticeForm(null);
document.getElementById("btnSettings").onclick = openSettings;
document.getElementById("btnManageGroups").onclick = () => openManage('group');
document.getElementById("btnManageTags").onclick = () => openManage('tag');
document.getElementById("btnPublishConfig").onclick = openPublishConfig;
document.getElementById("btnPublish").onclick = () => window.startPublish();

document.getElementById('btnImport').onclick = () => document.getElementById('fileImport').click();

document.getElementById('fileImport').onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (event) => {
    try {
      const parsed = JSON.parse(event.target.result);
      if (parsed && parsed.sites && parsed.notice) {
        registry = parsed;
        saveToLocal();
        render();
        alert('导入成功！数据已覆盖并保存至本地草稿。');
      } else {
        alert('文件格式错误：不是本工具的备份文件。');
      }
    } catch (err) { alert('解析文件失败。'); }
    e.target.value = '';
  };
  reader.readAsText(file);
};

document.getElementById('btnReset').onclick = async () => {
  if(!confirm('这会清空你当前未导出的本地草稿，并重新从线上（registry.json）拉取数据，确定吗？')) return;
  localStorage.removeItem(STORAGE_KEY);
  await loadData();
};

document.getElementById("btnExport").onclick = () => {
  registry.updatedAt = new Date().toISOString().split('T')[0];
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(registry, null, 2));
  const dlAnchor = document.createElement('a');
  dlAnchor.setAttribute("href", dataStr);
  dlAnchor.setAttribute("download", "registry.json");
  document.body.appendChild(dlAnchor);
  dlAnchor.click();
  dlAnchor.remove();
};

window.closeModal = () => { document.getElementById("modalMask").classList.remove("show"); };
document.getElementById("modalMask").onclick = e => { if(e.target.id === "modalMask") closeModal(); };

loadData();
</script>
