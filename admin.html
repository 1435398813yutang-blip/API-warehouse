<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>管理后台 - API小仓库</title>
  <style>
    :root{
      --bg:#f5f3ef; --card-rgb:255,255,255; --card-opacity:.95;
      --text:#2d2b28; --text-2:#6b6862; --border:#b8c0c6; 
      --accent:#8a9ba8; --accent-soft:#c7d0d4; --danger:#b57b7b;
      --radius:6px; --shadow:0 2px 8px rgba(0,0,0,.05);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{margin:0;padding:0;background:var(--bg);color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;font-size:15px}
    button{font-family:inherit}
    
    .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
      padding:12px 16px;background:rgba(255,255,255,0.9);backdrop-filter:blur(10px);
      border-bottom:1.5px solid var(--border)}
    .topbar h1{margin:0;font-size:17px;font-family:Georgia,serif;font-weight:600}
    .text-btn{background:none;border:none;color:var(--text-2);font-size:14px;cursor:pointer;padding:6px 10px;border-radius:var(--radius)}
    .text-btn:hover{background:rgba(0,0,0,.05);color:var(--text)}

    main{padding:16px 16px 90px}
    
    .section-title{font-size:14px;font-weight:600;color:var(--text-2);margin:20px 0 10px 4px;}
    
    .group{margin-bottom:16px}
    .group-head{display:flex;align-items:center;gap:8px;padding:8px 4px;cursor:pointer;user-select:none}
    .group-head .arrow{font-size:12px;color:var(--text-2);transition:.2s}
    .group.collapsed .arrow{transform:rotate(-90deg)}
    .group-head .gname{font-weight:600;font-size:14px;flex:1}
    .group-head .gcount{font-size:12px;color:var(--text-2)}
    .group.collapsed .group-body{display:none}

    .site-card{background:#fff;border:1.5px solid var(--border);border-radius:var(--radius);
      padding:12px;margin-bottom:8px;box-shadow:var(--shadow)}
    .site-top{display:flex;align-items:flex-start;gap:8px}
    .site-name{flex:1;font-weight:600;font-size:15px;word-break:break-all}
    .site-meta{margin-top:6px;font-size:12px;color:var(--text-2);word-break:break-all}
    .tag-list{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
    .tag{font-size:11px;padding:2px 7px;border-radius:var(--radius);background:var(--accent-soft);color:#fff}
    .site-note{margin-top:6px;font-size:12px;color:var(--text-2);white-space:pre-wrap;word-break:break-word}
    .btn-row{display:flex;gap:8px;margin-top:12px;padding-top:10px;border-top:1px dashed #eee}
    .btn{flex:1;padding:8px;border-radius:var(--radius);border:1.5px solid var(--border);
      background:transparent;color:var(--text);font-size:13px;cursor:pointer;text-align:center}
    .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
    .btn.danger{color:var(--danger);border-color:var(--danger)}

    .fab{position:fixed;right:16px;bottom:20px;padding:0 20px;height:48px;border-radius:24px;
      background:var(--accent);color:#fff;border:none;font-size:15px;font-weight:600;
      box-shadow:0 4px 12px rgba(0,0,0,.2);cursor:pointer;z-index:30;display:flex;align-items:center;justify-content:center}

    .modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:none;align-items:flex-end;justify-content:center}
    .modal-mask.show{display:flex}
    .modal{background:#fff;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;
      border-radius:16px 16px 0 0;padding:20px 16px;animation:slideUp .2s ease-out}
    @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
    .modal h3{margin:0 0 16px;font-size:16px;font-family:Georgia,serif}
    
    .field{margin-bottom:12px}
    .field label{display:block;font-size:12px;color:var(--text-2);margin-bottom:6px;font-weight:600}
    .field input,.field textarea{width:100%;padding:10px;border:1.5px solid var(--border);
      border-radius:var(--radius);background:#fff;font-size:14px;outline:none;font-family:inherit}
    .field textarea{min-height:80px;resize:vertical}
    
    .chip-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
    .chip{padding:6px 12px;border-radius:var(--radius);border:1.5px solid var(--border);
      background:#fff;font-size:13px;cursor:pointer;color:var(--text-2);user-select:none;transition:.1s}
    .chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}

    .notice-card{background:#fff;border:1.5px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:8px;box-shadow:var(--shadow)}
    .pin-badge{background:var(--danger); color:#fff; font-size:10px; padding:2px 5px; border-radius:4px; margin-right:6px;}

    /* 动态联系方式行 */
    .contact-row { display: flex; gap: 8px; margin-bottom: 8px; }
    .contact-row input { flex: 1; margin: 0; }
    .contact-row button { padding: 0 12px; border: 1.5px solid var(--danger); color: var(--danger); background: transparent; border-radius: var(--radius); cursor: pointer; }
  </style>
</head>
<body>

<header class="topbar">
  <h1>管理后台</h1>
  <div>
    <button class="text-btn" id="btnSettings">联系方式</button>
    <button class="text-btn" style="color:var(--accent)" id="btnAddSite">+ 新增站点</button>
  </div>
</header>

<main>
  <div class="section-title" style="display:flex;justify-content:space-between;align-items:center">
    <span>公告列表</span>
    <button class="text-btn" style="color:var(--accent);font-size:13px;padding:0" id="btnAddNotice">+ 新增公告</button>
  </div>
  <div id="noticeList"></div>

  <div class="section-title">收录站点列表</div>
  <div id="siteList"></div>
</main>

<div style="position:fixed; left:16px; bottom:20px; display:flex; gap:8px; z-index:30;">
  <button class="btn" style="width:auto; height:48px; border-radius:24px; padding:0 16px;" id="btnImport">导入</button>
  <button class="btn" style="width:auto; height:48px; border-radius:24px; padding:0 16px;" id="btnReset">恢复线上</button>
  <input type="file" id="fileImport" accept=".json" style="display:none">
</div>
<button class="fab" id="btnExport">导出 JSON</button>

<div class="modal-mask" id="modalMask">
  <div class="modal" id="modalBox"></div>
</div>

<script>
let registry = { 
  version: 1, updatedAt: "", notice: [], contact: [], 
  presetGroups: [], presetTags: [], sites: [] 
};
let currentGroups = [];
let currentTags = [];
let collapsedGroups = [];

const STORAGE_KEY = 'api_tool_registry_draft';

// 自动保存到本地草稿
function saveToLocal() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(registry));
}

async function loadData() {
  const draft = localStorage.getItem(STORAGE_KEY);
  
  if (draft) {
    try {
      registry = JSON.parse(draft);
      console.log('已加载本地草稿数据');
    } catch(e) {}
  } else {
    // 如果没有草稿，拉取线上文件
    try {
      const res = await fetch('./registry.json');
      if (res.ok) {
        registry = await res.json();
        saveToLocal();
        console.log('已从线上同步数据到本地草稿');
      }
    } catch (e) { 
      console.warn('读取 registry.json 失败，且无本地草稿'); 
    }
  }

  // 兼容旧数据修复
  if (registry.contact && !Array.isArray(registry.contact)) {
    const newContact = [];
    if (registry.contact.email) newContact.push({ label: '邮箱', value: registry.contact.email });
    if (registry.contact.qq) newContact.push({ label: 'QQ', value: registry.contact.qq });
    registry.contact = newContact;
  }
  if (!Array.isArray(registry.contact)) registry.contact = [];

  currentGroups = registry.presetGroups || ["付费站","公益站","有签到","限制签到","生图站"];
  currentTags = registry.presetTags || ["试吃","无试吃","试吃不确定","需邀请码","关闭注册","生图","视频","音频","抗截断","常用"];
  
  render();
}

function render() {
  renderNotices();
  renderSites();
}

function renderNotices() {
  const wrap = document.getElementById("noticeList");
  const notices = registry.notice || [];
  if(notices.length === 0) {
    wrap.innerHTML = `<div style="font-size:12px;color:#999;padding:10px 4px;">暂无公告</div>`;
    return;
  }
  const reversed = notices.slice().reverse();
  wrap.innerHTML = reversed.map((n, i) => {
    const trueIdx = notices.length - 1 - i;
    return `<div class="notice-card">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px;border-bottom:1px dashed #eee;padding-bottom:6px;">
        <b style="font-size:14px;">${n.isPinned ? '<span class="pin-badge">置顶</span>' : ''}${n.title}</b>
        <span style="font-size:12px;color:var(--text-2)">${n.date}</span>
      </div>
      <div style="font-size:13px;color:var(--text-2);white-space:pre-wrap;word-break:break-word;">${n.content}</div>
      <div class="btn-row">
        <button class="btn" onclick="editNotice(${trueIdx})">编辑</button>
        <button class="btn danger" onclick="deleteNotice(${trueIdx})">删除</button>
      </div>
    </div>`;
  }).join("");
}

function renderSites() {
  const wrap = document.getElementById("siteList");
  const allGroups = [...currentGroups];
  registry.sites.forEach(s => { if(s.group && !allGroups.includes(s.group)) allGroups.push(s.group); });

  const html = [];
  allGroups.forEach(g => {
    const items = registry.sites.filter(s => s.group === g);
    if(!items.length && !currentGroups.includes(g)) return;
    
    const isCollapsed = collapsedGroups.includes(g);
    html.push(`<section class="group ${isCollapsed ? 'collapsed' : ''}" data-group="${g}">
      <div class="group-head" onclick="toggleGroup('${g}')">
        <span class="arrow">▼</span>
        <span class="gname">${g}</span>
        <span class="gcount">${items.length}</span>
      </div>
      <div class="group-body">
        ${items.map(s => cardHTML(s)).join("")}
      </div>
    </section>`);
  });

  if(registry.sites.length === 0) {
    wrap.innerHTML = `<div style="text-align:center;color:#999;padding:20px">暂无收录站点</div>`;
  } else {
    wrap.innerHTML = html.join("");
  }
}

function cardHTML(s) {
  const tags = (s.tags || []).map(t => `<span class="tag">${t}</span>`).join("");
  return `<div class="site-card">
    <div class="site-top">
      <div class="site-name">${(s.tags||[]).includes("常用") ? '<span style="color:var(--accent)">☆</span> ' : ''}${s.name}</div>
    </div>
    <div class="site-meta">${s.invite}</div>
    <div class="tag-list">${tags}</div>
    ${s.note ? `<div class="site-note">${s.note}</div>` : ""}
    <div class="btn-row">
      <button class="btn" onclick="editSite('${s.id}')">编辑</button>
      <button class="btn danger" onclick="deleteSite('${s.id}')">删除</button>
    </div>
  </div>`;
}

window.toggleGroup = (g) => {
  const idx = collapsedGroups.indexOf(g);
  if (idx >= 0) collapsedGroups.splice(idx, 1);
  else collapsedGroups.push(g);
  renderSites();
};

window.deleteSite = (id) => {
  if (!confirm('确定删除该站点？')) return;
  registry.sites = registry.sites.filter(s => s.id !== id);
  saveToLocal();
  renderSites();
};

window.editSite = (id) => {
  const s = registry.sites.find(x => x.id === id);
  if(!s) return;
  openSiteForm(s);
};

window.deleteNotice = (idx) => {
  if(!confirm('确定删除这条公告？')) return;
  registry.notice.splice(idx, 1);
  saveToLocal();
  renderNotices();
};

window.editNotice = (idx) => {
  openNoticeForm(registry.notice[idx], idx);
};

function openSiteForm(site) {
  const isEdit = !!site;
  const s = site || { id: "r_" + Date.now(), name: "", invite: "", group: currentGroups[0], tags: [], note: "" };
  
  const groupChips = currentGroups.map(g => `<div class="chip ${s.group === g ? 'active' : ''}" data-group="${g}">${g}</div>`).join("");
  const tagChips = currentTags.map(t => `<div class="chip ${(s.tags||[]).includes(t) ? 'active' : ''}" data-tag="${t}">${t}</div>`).join("");

  document.getElementById("modalBox").innerHTML = `
    <h3>${isEdit ? '编辑站点' : '新增站点'}</h3>
    <input type="hidden" id="f-id" value="${s.id}">
    <div class="field"><label>站名 *</label><input id="f-name" value="${s.name}"></div>
    <div class="field"><label>链接 *</label><input id="f-invite" value="${s.invite}"></div>
    <div class="field"><label>分组（点击选择）</label><div class="chip-row" id="groupPicker">${groupChips}</div></div>
    <div class="field"><label>标签（点击多选）</label><div class="chip-row" id="tagPicker">${tagChips}</div></div>
    <div class="field"><label>备注</label><textarea id="f-note">${s.note||''}</textarea></div>
    <div class="btn-row" style="border:none;margin-top:20px;">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn primary" onclick="saveSiteForm()">保存</button>
    </div>
  `;

  document.querySelectorAll("#groupPicker .chip").forEach(c => {
    c.onclick = () => {
      document.querySelectorAll("#groupPicker .chip").forEach(el => el.classList.remove("active"));
      c.classList.add("active");
    };
  });
  document.querySelectorAll("#tagPicker .chip").forEach(c => {
    c.onclick = () => c.classList.toggle("active");
  });

  document.getElementById("modalMask").classList.add("show");
}

window.saveSiteForm = () => {
  const id = document.getElementById("f-id").value;
  const name = document.getElementById("f-name").value.trim();
  const invite = document.getElementById("f-invite").value.trim();
  if(!name || !invite) return alert("站名和链接必填");

  const activeGroup = document.querySelector("#groupPicker .chip.active");
  const group = activeGroup ? activeGroup.dataset.group : "其他";
  const tags = [...document.querySelectorAll("#tagPicker .chip.active")].map(c => c.dataset.tag);
  const obj = { id, name, invite, group, tags, note: document.getElementById("f-note").value.trim() };
  
  if(idx >= 0) registry.sites[idx] = obj;
  else registry.sites.push(obj);

  saveToLocal();
  closeModal();
  renderSites();
};

function openNoticeForm(notice, idx) {
  const isEdit = idx !== undefined;
  const n = notice || { date: new Date().toISOString().split('T')[0], title: "", content: "", isPinned: false };

  document.getElementById("modalBox").innerHTML = `
    <h3>${isEdit ? '编辑公告' : '发布新公告'}</h3>
    <input type="hidden" id="n-idx" value="${isEdit ? idx : ''}">
    <div class="field"><label>日期</label><input id="n-date" value="${n.date}"></div>
    <div class="field"><label>标题</label><input id="n-title" value="${n.title}"></div>
    <div class="field"><label>内容（支持换行）</label><textarea id="n-content" style="min-height:120px">${n.content}</textarea></div>
    <div class="field" style="display:flex; align-items:center; gap:8px;">
      <input type="checkbox" id="n-pinned" ${n.isPinned ? 'checked' : ''} style="width:16px; height:16px; margin:0;">
      <label for="n-pinned" style="margin:0; cursor:pointer;">是否置顶此公告</label>
    </div>
    <div class="btn-row" style="border:none;margin-top:20px;">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn primary" onclick="saveNoticeForm()">保存</button>
    </div>
  `;
  document.getElementById("modalMask").classList.add("show");
}

window.saveNoticeForm = () => {
  const idxStr = document.getElementById("n-idx").value;
  const date = document.getElementById("n-date").value.trim();
  const title = document.getElementById("n-title").value.trim();
  const content = document.getElementById("n-content").value.trim();
  const isPinned = document.getElementById("n-pinned").checked;
  if(!title || !content) return alert("标题和内容必填");

  const obj = { date, title, content, isPinned };
  if(idxStr !== '') {
    registry.notice[Number(idxStr)] = obj;
  } else {
    registry.notice.push(obj); 
  }
  saveToLocal();
  closeModal();
  renderNotices();
};

// ====== 动态联系方式设置 ======
function openSettings() {
  const contactList = registry.contact || [];
  
  const rowsHtml = contactList.map((c, i) => `
    <div class="contact-row" id="contact-row-${i}">
      <input type="text" class="c-label" value="${c.label || ''}" placeholder="名称(如微信)">
      <input type="text" class="c-value" value="${c.value || ''}" placeholder="内容">
      <button type="button" onclick="document.getElementById('contact-row-${i}').remove()">删除</button>
    </div>
  `).join("");

  document.getElementById("modalBox").innerHTML = `
    <h3>联系方式设置</h3>
    <div class="field">
      <label>动态字段列表（可以自定义添加，如微信、TG等）</label>
      <div id="contactListWrap">
        ${rowsHtml}
      </div>
      <button class="btn" style="width:100%;margin-top:8px; border-style:dashed;" onclick="addContactRow()">+ 新增一行</button>
    </div>
    
    <div class="btn-row" style="border:none;margin-top:20px;">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn primary" onclick="saveSettings()">保存</button>
    </div>
  `;
  document.getElementById("modalMask").classList.add("show");
}

window.addContactRow = () => {
  const wrap = document.getElementById("contactListWrap");
  const div = document.createElement("div");
  div.className = "contact-row";
  const tempId = 'new_' + Date.now();
  div.id = tempId;
  div.innerHTML = `
    <input type="text" class="c-label" placeholder="名称(如微信)">
    <input type="text" class="c-value" placeholder="内容">
    <button type="button" onclick="document.getElementById('${tempId}').remove()">删除</button>
  `;
  wrap.appendChild(div);
};

window.saveSettings = () => {
  const rows = document.querySelectorAll("#contactListWrap .contact-row");
  const newContact = [];
  rows.forEach(row => {
    const label = row.querySelector(".c-label").value.trim();
    const value = row.querySelector(".c-value").value.trim();
    if (label && value) {
      newContact.push({ label, value });
    }
  });
  registry.contact = newContact;
  saveToLocal();
  closeModal();
  alert("联系方式已更新并自动保存至草稿，请记得导出并替换文件");
};

document.getElementById("btnAddSite").onclick = () => openSiteForm(null);
document.getElementById("btnAddNotice").onclick = () => openNoticeForm(null);
document.getElementById("btnSettings").onclick = openSettings;

document.getElementById('btnImport').onclick = () => {
  document.getElementById('fileImport').click();
};

document.getElementById('fileImport').onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (event) => {
    try {
      const parsed = JSON.parse(event.target.result);
      if (parsed && parsed.sites && parsed.notice) {
        registry = parsed;
        saveToLocal();
        render();
        alert('导入成功！数据已覆盖并保存至本地草稿。');
      } else {
        alert('文件格式错误：不是本工具的备份文件。');
      }
    } catch (err) {
      alert('解析文件失败。');
    }
    e.target.value = '';
  };
  reader.readAsText(file);
};

document.getElementById('btnReset').onclick = async () => {
  if(!confirm('这会清空你当前未导出的本地草稿，并重新从线上（registry.json）拉取数据，确定吗？')) return;
  localStorage.removeItem(STORAGE_KEY);
  await loadData();
};

document.getElementById("btnExport").onclick = () => {
  registry.updatedAt = new Date().toISOString().split('T')[0];
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(registry, null, 2));
  const dlAnchor = document.createElement('a');
  dlAnchor.setAttribute("href", dataStr);
  dlAnchor.setAttribute("download", "registry.json");
  document.body.appendChild(dlAnchor);
  dlAnchor.click();
  dlAnchor.remove();
};

window.closeModal = () => {
  document.getElementById("modalMask").classList.remove("show");
};

document.getElementById("modalMask").onclick = e => {
  if(e.target.id === "modalMask") closeModal();
};

loadData();
</script>
</body>
</html>
