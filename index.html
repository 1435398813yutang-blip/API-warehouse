<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>API小仓库</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#8a9ba8">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="wallpaper"></div>

<header class="topbar">
  <h1 id="appName">API小仓库</h1>
  <button class="text-btn" id="btnNotice">公告</button>
  <button class="text-btn" id="btnSearch">搜索</button>
  <button class="text-btn" id="btnSettings">设置</button>
</header>

<div class="search-bar" id="searchBar">
  <input id="searchInput" type="search" placeholder="搜索站名、标签、备注…">
  <button class="text-btn" id="btnCloseSearch">关闭</button>
</div>

<div class="entry-row">
  <button class="entry-btn" id="btnRegistry">收录站点（点击展开）</button>
</div>

<section class="registry-panel" id="registryPanel" hidden>
  <div class="reg-head">
    <h2>收录站点</h2>
    <button class="text-btn" id="regClose">关闭</button>
  </div>
  
  <div class="filter-wrap">
    <div class="filter-head" id="regFilterToggle">
      <span id="regFilterTitle">筛选与排序（点击展开）</span>
      <span class="arrow" id="regFilterArrow">▼</span>
    </div>
    <div class="filter-content" id="regFilterContent" style="display:none">
      <div class="filter-block" style="padding-top:4px">
        <input id="regSearch" type="search" placeholder="搜索收录站点…" style="width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:var(--radius);background:#ffffff !important;color:#2d2b28 !important;font-size:14px;outline:none;margin-bottom:8px;-webkit-appearance:none;">
      </div>
      <div class="filter-block">
        <span class="filter-label">分组</span>
        <div class="chip-row" id="regGroupFilter"></div>
      </div>
      <div class="filter-block">
        <span class="filter-label">标签（可多选）</span>
        <div class="chip-row" id="regTagFilter"></div>
      </div>
    </div>
  </div>

  <div class="reg-body" id="regList"></div>
</section>

<div class="section-divider"><span>我的站点</span></div>

<div class="filter-wrap">
  <div class="filter-head" id="filterToggle">
    <span id="filterTitle">筛选与排序（点击展开）</span>
    <span class="arrow" id="filterArrow">▼</span>
  </div>
  <div class="filter-content" id="filterContent" style="display:none">
    <div class="filter-block">
      <span class="filter-label">分组</span>
      <div class="chip-row" id="groupFilter"></div>
    </div>
    <div class="filter-block">
      <span class="filter-label">标签（可多选）</span>
      <div class="chip-row" id="tagFilter"></div>
    </div>
    <div class="sort-row">
      <span>排序</span>
      <select id="sortSelect">
        <option value="custom">默认（常用优先）</option>
        <option value="name-asc">名称 A→Z</option>
        <option value="name-desc">名称 Z→A</option>
        <option value="balance-desc">余额高→低</option>
        <option value="balance-asc">余额低→高</option>
        <option value="recent">最近打开</option>
      </select>
    </div>
  </div>
</div>

<main id="siteList"></main>
<button class="fab" id="btnAdd" title="添加站点">+</button>

<div class="modal-mask" id="modalMask">
  <div class="modal" id="modalBox"></div>
</div>

<div class="toast" id="toast"></div>

<script src="js/app.js"></script>
</body>
</html>
